appId: ai.cova.app
---
# Navigate to existing render — must result in visible render image
# Waits for rooms to load, then taps the first room card with a render thumbnail
- extendedWaitUntil:
    visible:
      text: "My Rooms"
    timeout: 15000

# Wait for room cards to render (they load from Supabase)
- extendedWaitUntil:
    visible:
      id: "room-card-0"
    timeout: 10000
- tapOn:
    id: "room-card-0"
- extendedWaitUntil:
    visible:
      id: "render-view-screen"
    timeout: 15000
# Verify render image is actually showing — not error state
- assertNotVisible: "Render not available"
- assertVisible:
    id: "render-flat-image"
