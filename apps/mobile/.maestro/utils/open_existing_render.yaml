appId: ai.cova.app
---
# Open an existing room's render from the dashboard (returning user)
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "My Rooms"
- tapOn:
    id: "room-card-0"
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: "render-view-screen"
