- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "Analyzing your room"
- waitForAnimationToEnd:
    timeout: 20000
- assertVisible: "Applying your style"
- waitForAnimationToEnd:
    timeout: 30000
- assertVisible: "Generating"
- waitForAnimationToEnd:
    timeout: 60000
- assertVisible: "Done"
- waitForAnimationToEnd
