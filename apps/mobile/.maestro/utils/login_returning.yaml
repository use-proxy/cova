appId: ai.cova.app
---
- launchApp:
    clearState: false
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- runFlow:
    file: do_signin_returning.yaml
    when:
      visible: "Create Account"
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "My Rooms"
    timeout: 30000
