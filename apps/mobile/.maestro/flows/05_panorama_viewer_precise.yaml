appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 05: Panorama Viewer — strict verification per PRODUCT_TRUTH.md
# End state: full-screen render image, HUD buttons all present,
# Compare and 2D View buttons work

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# --- Render image visible ---
- assertVisible:
    id: "render-view-screen"
- assertVisible:
    id: "render-flat-image"
- assertNotVisible: "Render not available"

# --- All HUD buttons visible on load ---
- assertVisible: "999"
- assertVisible: "Regenerate"
- assertVisible: "Save"
- assertVisible: "Share"
- assertVisible: "Arrange"
- assertVisible: "Chat"
- assertVisible: "Shop"
- assertVisible: "Compare"
- assertVisible: "2D View"

# --- Compare button activates Before/After slider ---
- tapOn: "Compare"
- waitForAnimationToEnd
- assertVisible: "BEFORE"
- assertVisible: "AFTER"
- assertVisible:
    id: "before-after-slider"

# --- Dismiss Compare slider ---
- tapOn: "Compare"
- waitForAnimationToEnd

# --- Switch to 2D View ---
- tapOn: "2D View"
- waitForAnimationToEnd
