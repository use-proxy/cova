appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 04: Render Pipeline — strict per PRODUCT_TRUTH.md

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# --- Render view loaded with actual image ---
- assertVisible:
    id: "render-view-screen"
- assertVisible:
    id: "render-flat-image"
- assertNotVisible: "Render not available"

# --- Assert all HUD buttons while HUD is initially visible ---
- assertVisible: "999"
- assertVisible: "Regenerate"
- assertVisible: "Save"
- assertVisible: "Share"
- assertVisible: "Arrange"
- assertVisible: "Chat"
- assertVisible: "Shop"
- assertVisible: "Compare"
- assertVisible: "2D View"

# --- Activate Before/After slider ---
- tapOn: "Compare"
- waitForAnimationToEnd
- assertVisible: "BEFORE"
- assertVisible: "AFTER"
- assertVisible:
    id: "before-after-slider"
