appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 04: Render Pipeline — strict per PRODUCT_TRUTH.md

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# --- Render view loaded with actual image ---
- assertVisible:
    id: "render-view-screen"
- assertVisible:
    id: "render-flat-image"
- assertNotVisible: "Render not available"

# --- Token + first HUD buttons (assert quickly before 3s auto-hide) ---
- assertVisible: "999"
- assertVisible: "Regenerate"
- assertVisible: "Save"

# --- Tap to re-show HUD for remaining buttons ---
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- assertVisible: "Share"
- assertVisible: "Arrange"
- assertVisible: "Chat"
- assertVisible: "Shop"
- assertVisible: "Compare"
- assertVisible: "2D View"

# --- Wait for HUD to fully auto-hide ---
- extendedWaitUntil:
    notVisible:
      text: "Regenerate"
    timeout: 6000

# --- Tap to re-show HUD, then activate Before/After slider ---
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- assertVisible: "Compare"
- tapOn: "Compare"
- waitForAnimationToEnd
- assertVisible: "BEFORE"
- assertVisible: "AFTER"
- assertVisible:
    id: "before-after-slider"
