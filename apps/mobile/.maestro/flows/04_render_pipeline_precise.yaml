appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 04: Render Pipeline — strict validation of full render experience
# Validates: render image visible (flat or panorama), HUD buttons, token 999

- runFlow: ../utils/login_new.yaml

# After login with clearState, app lands on New Room screen.
# Navigate back to dashboard by tapping the back arrow.
- waitForAnimationToEnd:
    timeout: 5000

# Tap back arrow at top-left of New Room screen
- tapOn:
    text: "←"
    optional: true
- tapOn:
    point: "7%,9%"
- waitForAnimationToEnd:
    timeout: 5000

# Now on dashboard — wait for rooms to load
- extendedWaitUntil:
    visible:
      id: "room-card-0"
    timeout: 20000

# Tap the first room card to open its render
- tapOn:
    id: "room-card-0"
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 15000

# --- Render view screen must be present ---
- assertVisible:
    id: "render-view-screen"

# --- Render image must be visible (flat fallback or panorama) ---
- assertNotVisible: "Render not available"
- assertNotVisible: "Could not load render"

# --- Token balance must show 999 (HUD visible on initial load) ---
- assertVisible: "999"

# --- All HUD buttons must be visible (assert before 3s auto-hide) ---
- assertVisible: "Regenerate"
- assertVisible: "Save"
- assertVisible: "Share"
- assertVisible: "Chat"
- assertVisible: "Shop"

# --- No error states ---
- assertNotVisible:
    id: "panorama-error"
