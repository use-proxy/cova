appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 03: Room Capture — upload photo path, full pipeline to choice screen

- runFlow: ../utils/login_returning.yaml

# Dismiss iOS "Save Password?" system dialog if shown
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

# --- Start new room ---
- tapOn:
    id: "new-room-button"
- waitForAnimationToEnd

# Select room type from Alert
- tapOn: "Living Room"
- waitForAnimationToEnd

# "Your Style Profile" dialog — appears for returning users with an existing style profile
- tapOn:
    text: "Use My Previous Style"
    optional: true
- waitForAnimationToEnd

# Style quiz may appear if no strong style profile exists — skip it
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd

# --- Budget step ---
- assertVisible: "Budget"
- assertVisible:
    id: "budget-slider"
- assertVisible: "$2,500"
- tapOn: "Continue"
- waitForAnimationToEnd

# --- Capture method selection ---
- waitForAnimationToEnd
- assertVisible:
    id: "take-photo-btn"
- assertVisible:
    id: "upload-from-library-btn"

# Upload a photo from simulator library
- tapOn:
    id: "upload-from-library-btn"
- waitForAnimationToEnd

# --- iOS system photo picker ---
# Select the first photo in the library
- tapOn:
    text: "All Photos"
    optional: true
- waitForAnimationToEnd
- tapOn:
    index: 0
    optional: true
- waitForAnimationToEnd

# --- Review step ---
- assertVisible:
    text: "Your Photo"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# --- Room details step ---
- assertVisible:
    text: "Room Details"
    optional: true
- tapOn:
    text: "Start Designing"
    optional: true
- waitForAnimationToEnd

# --- Processing / loading stages ---
# App navigates to RenderView with autoGenerate=true and starts render
- extendedWaitUntil:
    visible:
      text: "Analyzing your room"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      text: "Applying your style"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible:
      text: "Generating"
    timeout: 60000
    optional: true

# --- Choice screen (appears after render completes) ---
- extendedWaitUntil:
    visible:
      text: "View AI Render"
    timeout: 300000
- assertVisible: "Arrange Furniture"

# Tap View AI Render to proceed
- tapOn: "View AI Render"
- waitForAnimationToEnd

# --- Render view screen ---
- assertVisible:
    id: "render-view-screen"
