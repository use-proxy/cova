appId: ai.cova.app
---
- launchApp:
    clearState: false
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# --- Splash screen ---
- assertVisible: "Sign In"
- assertVisible: "Create Account"

# --- Navigate to Auth ---
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"

# --- Toggle test ---
- tapOn:
    text: "Create Account"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Sign In"
    index: 0
- waitForAnimationToEnd

# --- Sign in ---
- tapOn:
    id: "email-input"
- inputText: "test.newuser@hellocova.com"
- pressKey: Enter
- tapOn:
    id: "password-toggle"
- inputText: "CovaTest123!"
- tapOn:
    text: "Sign In"
    index: 1
- extendedWaitUntil:
    visible:
      text: "My Rooms"
    timeout: 30000
