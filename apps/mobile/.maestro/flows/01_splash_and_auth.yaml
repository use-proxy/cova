appId: ai.cova.app
---
# Flow 01: Splash Screen and Authentication — happy path
# Validates auth screen branding, mode toggle, and successful sign-in

# --- Launch app (clearState) → lands on splash or auth ---
- launchApp:
    appId: ai.cova.app
    clearState: true
# App may skip splash and land directly on auth; wait for auth elements
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Sign In"
- assertVisible: "Create Account"

# --- Navigate to Auth (Sign In mode) ---
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"
- assertVisible: "Privacy Policy"
- assertVisible: "Terms of Service"

# --- Toggle to Create Account mode and back ---
- tapOn:
    text: "Create Account"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Sign In"
    index: 0
- waitForAnimationToEnd

# --- Successful sign in (happy path) ---
- tapOn:
    id: "email-input"
- inputText: "test.newuser@hellocova.com"
- tapOn:
    id: "password-input"
- waitForAnimationToEnd:
    timeout: 1000
- clearKeychain
- inputText: "CovaTest123!"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    text: "Sign In"
    index: 1
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: "Your Rooms"
