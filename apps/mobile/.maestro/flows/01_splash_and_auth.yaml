appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
- launchApp:
    clearState: true

# Dismiss tracking permission dialog if it appears
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Expo dev build launcher — tap the dev server to connect
- extendedWaitUntil:
    visible:
      text: "http://localhost:8081"
    timeout: 10000
- tapOn:
    text: "http://localhost:8081"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000

# Dismiss Expo dev menu welcome dialog if it appears
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close dev menu by tapping the dark area above the menu sheet
- tapOn:
    point: "50%,20%"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 3000

# --- Splash screen ---
- extendedWaitUntil:
    visible:
      text: "Create Account"
    timeout: 30000
- assertVisible: "Sign In"
- assertVisible: "Create Account"

# --- Navigate to Auth ---
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"

# --- Toggle test ---
- tapOn:
    text: "Create Account"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Sign In"
    index: 0
- waitForAnimationToEnd

# --- Sign in ---
- tapOn:
    id: "email-input"
- inputText: "test.newuser@hellocova.com"
- pressKey: Enter
- tapOn:
    id: "password-toggle"
- inputText: "CovaTest123!"
- tapOn:
    text: "tinder for your home"
    optional: true
- tapOn:
    text: "Sign In"
    index: 1
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      text: "cova"
    timeout: 30000
