appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 08: Product Panel — tap Shop to open, verify panel, close

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# Tap Shop button in HUD to open product panel
- tapOn: "Shop"
- waitForAnimationToEnd

# Product panel header should be visible
- assertVisible: "Matched Products"

# Close product panel by tapping X
- tapOn: "✕"
- waitForAnimationToEnd

# HUD should still be visible after close
- assertVisible: "999"
