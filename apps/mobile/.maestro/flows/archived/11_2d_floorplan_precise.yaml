appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 11: 2D Floor Plan Toggle — switch between 3D and 2D views
# Prereq: in 3D viewer

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# Navigate to 3D viewer
- tapOn: "Arrange"
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: "room-viewer-3d"

# 2D toggle button should be present and show "2D" (default 3D mode)
- assertVisible: "2D"
- assertVisible:
    id: "floorplan-toggle"

# Style chips and other controls should be visible
- assertVisible: "Ocean Breeze"
- assertVisible: "Save"
- assertVisible: "Reset"

# 3D viewer should be stable
- assertVisible:
    id: "room-viewer-3d"
