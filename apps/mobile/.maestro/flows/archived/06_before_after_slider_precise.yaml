appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 06: Before/After Slider — tap Compare to reveal, swipe, dismiss

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# Verify render view is loaded
- assertVisible:
    id: "render-view-screen"

# Tap Compare to reveal the before/after slider
- tapOn: "Compare"
- waitForAnimationToEnd

# Slider and labels should now be visible
- assertVisible:
    id: "before-after-slider"
- assertVisible: "BEFORE"
- assertVisible: "AFTER"

# Drag the slider to reveal more of the before image
- swipe:
    id: "before-after-slider"
    direction: RIGHT
    duration: 600
- waitForAnimationToEnd

# Drag slider back to show more of the AI render
- swipe:
    id: "before-after-slider"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd

# Slider should still be functional
- assertVisible:
    id: "before-after-slider"

# Dismiss by tapping Compare again
- tapOn: "Compare"
- waitForAnimationToEnd
