appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 07: HUD — all buttons visible, token shows 999

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# HUD should be visible initially on load
- assertVisible:
    id: "hud-container"
- assertVisible: "999"

# Bottom action bar should have all buttons
- assertVisible: "Save"
- assertVisible: "Share"
- assertVisible: "Regenerate"
- assertVisible: "Arrange"
- assertVisible: "Chat"
- assertVisible: "Shop"
- assertVisible: "Compare"
- assertVisible: "2D View"

# Token should show 999
- assertVisible: "999"
