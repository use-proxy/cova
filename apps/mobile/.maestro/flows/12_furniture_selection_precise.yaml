appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 12: Furniture Selection — add, select, drag, undo
# Prereq: in 3D viewer

- runFlow: ../utils/login_returning.yaml
- runFlow: ../utils/open_existing_render.yaml

# Navigate to 3D viewer
- tapOn: "Arrange"
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: "room-viewer-3d"

# Tap "Add Furniture" FAB
- tapOn:
    id: "add-fab"
- waitForAnimationToEnd

# Furniture catalog modal should appear
- assertVisible: "Add Furniture"

# Tap first catalog item
- tapOn:
    id: "catalog-item-0"
- waitForAnimationToEnd

# Undo should be available after adding furniture
- assertVisible:
    id: "undo-button"

# Tap undo to remove the placed furniture
- tapOn:
    id: "undo-button"
- waitForAnimationToEnd
