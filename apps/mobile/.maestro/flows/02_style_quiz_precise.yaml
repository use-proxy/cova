appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 02: Style Quiz — instructions, swiping, no style names visible
# Prereq: logged in as new user on dashboard

- runFlow: ../utils/login_new.yaml

# Tap + to create new room — opens room type selector modal
- waitForAnimationToEnd
- tapOn:
    id: "new-room-button"
    optional: true
- tapOn:
    text: "+"
    optional: true
- waitForAnimationToEnd

# Select room type from modal
- extendedWaitUntil:
    visible:
      text: "Select Room Type"
    timeout: 10000
- tapOn: "Living Room"
- waitForAnimationToEnd

# --- Instructions phase (auto-navigated after room type selection) ---
- extendedWaitUntil:
    visible:
      text: "Discover your style"
    timeout: 10000
- assertVisible: "Start Swiping"
- assertVisible: "Skip"
- tapOn: "Start Swiping"
- waitForAnimationToEnd

# --- Quiz card phase ---
- assertVisible:
    id: "quiz-card"
# No style names should be visible to user
- assertNotVisible: "Japandi"
- assertNotVisible: "Coastal"
- assertNotVisible: "Bohemian"
- assertNotVisible: "Mid-Century Modern"
- assertNotVisible: "Minimalist"

# --- Perform swipes (right = love, left = pass) ---
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd

# After 10+ swipes with >65% confidence, quiz should auto-complete
# and navigate to RoomCapture
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "Budget"
