appId: ai.cova.app
device:
  platform: ios
  type: simulator
---
# Flow 02: Style Quiz — instructions, swiping, no style names visible
# Prereq: logged in as new user on dashboard

- runFlow: ../utils/login_new.yaml

# Tap + to create new room — opens room type selector modal
- waitForAnimationToEnd
- tapOn:
    id: "new-room-button"
    optional: true
- tapOn:
    text: "+"
    optional: true
- waitForAnimationToEnd

# Select room type from modal
- extendedWaitUntil:
    visible:
      text: "Select Room Type"
    timeout: 10000
- tapOn: "Living Room"
- waitForAnimationToEnd

# --- Instructions phase (auto-navigated after room type selection) ---
- extendedWaitUntil:
    visible:
      text: "Discover your style"
    timeout: 10000
- assertVisible: "Start Swiping"
- assertVisible: "Skip"
- tapOn: "Start Swiping"
- waitForAnimationToEnd

# --- Quiz card phase ---
- assertVisible:
    id: "quiz-card"
# No style names should be visible to user
- assertNotVisible: "Japandi"
- assertNotVisible: "Coastal"
- assertNotVisible: "Bohemian"
- assertNotVisible: "Mid-Century Modern"
- assertNotVisible: "Minimalist"

# --- Phase 1: Baseline swipes (10 cards, 2 per style) ---
# Swipe right on most, left on a few — simulates real user preference
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd

# --- Phase 2: Refinement cards load dynamically ---
# Wait for refinement card to appear, then keep swiping
- waitForAnimationToEnd:
    timeout: 8000

# Swipe through refinement cards if they appear
# All swipes here are optional — quiz may have already completed by confidence after 10 swipes
- extendedWaitUntil:
    visible:
      id: "quiz-card"
    timeout: 8000
    optional: true
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "quiz-card"
    timeout: 8000
    optional: true
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "quiz-card"
    timeout: 8000
    optional: true
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "quiz-card"
    timeout: 8000
    optional: true
- swipe:
    id: "quiz-card"
    direction: RIGHT
    duration: 500
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Quiz completes via confidence (>=0.60 after 10+ swipes) or timeout (120s)
# Wait up to 130s for quiz to auto-complete and navigate to Room Capture
- extendedWaitUntil:
    visible:
      text: "Budget"
    timeout: 130000
