appId: ai.cova.app
---
- launchApp:
    clearState: true
- assertVisible: "tinder for your home"
- waitForAnimationToEnd
- tapOn: "Create Account"
- assertVisible: "Email"
- tapOn:
    id: "email-input"
- inputText: "test+maestro@hellocova.com"
- tapOn:
    id: "password-input"
- inputText: "TestPassword123!"
- tapOn: "Create Account"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Your Rooms"
