appId: ai.cova.app
---
- launchApp
- waitForAnimationToEnd:
    timeout: 120000
- tapOn: "Arrange Furniture"
- assertVisible:
    id: "room-viewer-3d"
- assertNotVisible: "Cannot set properties of undefined"
- swipe:
    startX: 50%
    startY: 50%
    endX: 70%
    endY: 50%
    duration: 500
- waitForAnimationToEnd
