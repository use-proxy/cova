name: Verify Cova
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: cd apps/mobile && npx tsc --noEmit
      - name: Run test suite
        run: npx ts-node supabase/functions/tests/run-all.ts
      - name: Security check
        run: |
          if grep -r "sk-ant\|r8_\|service_role" apps/mobile/src --include="*.ts" --include="*.tsx" -q; then
            echo "Hardcoded API key detected"
            exit 1
          fi
