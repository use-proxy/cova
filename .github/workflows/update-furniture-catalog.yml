name: Update Furniture Catalog

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # pipeline can take a while on first run

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Install script dependencies
        run: |
          npm install --save-dev \
            @gltf-transform/core \
            @gltf-transform/functions \
            @gltf-transform/cli \
            node-fetch \
            ts-node \
            typescript
        working-directory: ${{ github.workspace }}

      - name: Run furniture catalog generator
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        run: npx ts-node scripts/generate-furniture-catalog.ts
        working-directory: ${{ github.workspace }}

      - name: Run price updater
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AMAZON_PARTNER_TAG:    ${{ secrets.AMAZON_PARTNER_TAG }}
        run: npx ts-node scripts/update-furniture-prices.ts
        working-directory: ${{ github.workspace }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet apps/mobile/src/data/furnitureCatalog.ts \
            apps/mobile/assets/models/ \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/data/furnitureCatalog.ts
          git add apps/mobile/assets/models/ || true
          git commit -m "chore: auto-update furniture catalog [skip ci]

          Generated by update-furniture-catalog workflow.
          $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
