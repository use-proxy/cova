<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cova Pipeline Gallery</title>
<style>
  :root {
    --bg: #0A1628;
    --surface: #0F1F3D;
    --border: #1E3A5F;
    --gold: #C9A84C;
    --gold-soft: #F0D080;
    --text: #F8F6F1;
    --text-2: #8BA3C0;
    --success: #4A9B7F;
    --warn: #D4A84C;
    --error: #C0504A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Inter", system-ui, sans-serif; }
  body { padding: 32px 24px 80px; }
  header {
    max-width: 1600px;
    margin: 0 auto 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 6px;
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  h1 .gold { color: var(--gold); }
  .subtitle {
    margin: 0 0 16px;
    color: var(--text-2);
    font-size: 14px;
    font-weight: 400;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface);
    font-size: 13px;
    color: var(--text);
  }
  .pill strong { color: var(--gold); font-weight: 600; }
  .pill.success strong { color: var(--success); }
  .pill.warn strong { color: var(--warn); }
  .pill.error strong { color: var(--error); }

  .grid {
    max-width: 1600px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 200ms ease-out;
  }
  .card:hover { border-color: var(--gold); }

  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .head-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .scenario-id {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.04em;
  }
  .room-type {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-2);
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 24px;
  }
  .source-name {
    font-size: 12px;
    color: var(--text-2);
    font-family: "SF Mono", ui-monospace, monospace;
  }
  .badge {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 24px;
    font-weight: 600;
  }
  .badge.ok { background: rgba(74,155,127,0.12); color: var(--success); border: 1px solid rgba(74,155,127,0.4); }
  .badge.warn { background: rgba(212,168,76,0.14); color: var(--warn); border: 1px solid rgba(212,168,76,0.4); }
  .badge.err { background: rgba(192,80,74,0.14); color: var(--error); border: 1px solid rgba(192,80,74,0.5); }

  .images {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
  }
  .image-slot {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 260px;
  }
  .image-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    background: #050B14;
  }
  .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-wrap.not-empty { box-shadow: inset 0 0 0 3px var(--error); }
  .image-wrap.empty-verified { box-shadow: inset 0 0 0 2px rgba(74,155,127,0.55); }
  .placeholder {
    color: var(--text-2);
    font-size: 13px;
    padding: 24px;
    text-align: center;
  }
  .placeholder.err { color: var(--error); }
  .image-label {
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-2);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .image-label .lab-name { color: var(--text); }

  .meta {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .blend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .blend-chip {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(201,168,76,0.08);
    color: var(--gold-soft);
    border: 1px solid rgba(201,168,76,0.25);
  }
  .blend-chip .pct { color: var(--text-2); font-weight: 400; margin-left: 6px; }

  .personalization {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-2);
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border-left: 2px solid var(--gold);
    border-radius: 4px;
  }
  .validation-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 24px;
    border: 1px solid transparent;
  }
  .chip.green { background: rgba(74,155,127,0.10); color: var(--success); border-color: rgba(74,155,127,0.35); }
  .chip.yellow { background: rgba(212,168,76,0.12); color: var(--warn); border-color: rgba(212,168,76,0.35); }
  .chip.red { background: rgba(192,80,74,0.12); color: var(--error); border-color: rgba(192,80,74,0.45); }
  .chip.grey { background: rgba(139,163,192,0.08); color: var(--text-2); border-color: var(--border); }

  .errors {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--error);
    background: rgba(192,80,74,0.06);
    padding: 10px 12px;
    border-radius: 6px;
    border-left: 2px solid var(--error);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
  }

  @media (min-width: 1400px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  .empty-state {
    max-width: 600px;
    margin: 80px auto;
    text-align: center;
    color: var(--text-2);
    font-size: 14px;
  }
  .empty-state a { color: var(--gold); }
</style>
</head>

<script>
function fmt(n) { return (n * 100).toFixed(0) + "%"; }
function esc(s) { return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function load() {
  try {
    const raw = document.getElementById("gallery-data").textContent;
    const data = JSON.parse(raw);
    render(data);
  } catch (e) {
    document.getElementById("subtitle").textContent = "Failed to parse inline data.";
    document.getElementById("empty").textContent = "No results to display. " + e.message;
  }
}

function render(data) {
  const total = (data.results || []).length;
  const completed = data.completed || 0;
  const verified = data.empty_verified || 0;
  const errored = (data.results || []).filter(r => r.errors && r.errors.length).length;
  const renders = (data.results || []).filter(r => r.redesign_rel).length;

  document.getElementById("subtitle").textContent = "generated " + (data.generated_at || "—");
  const stats = document.getElementById("stats");
  stats.innerHTML = "";
  stats.append(
    chipStat("success", `${completed}/15`, "pipeline completed"),
    chipStat("success", `${verified}/${total}`, "empty rooms verified clean"),
    chipStat("", `${renders}/15`, "redesigns generated"),
    chipStat(errored > 0 ? "error" : "", `${errored}/${total}`, "with errors"),
  );

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!total) {
    const d = document.createElement("div");
    d.className = "empty-state";
    d.textContent = "No scenarios yet.";
    grid.appendChild(d);
    return;
  }

  for (const r of data.results) grid.appendChild(card(r));
}

function chipStat(kind, big, label) {
  const el = document.createElement("span");
  el.className = "pill " + (kind ? kind : "");
  el.innerHTML = `<strong>${big}</strong> <span>${label}</span>`;
  return el;
}

function card(r) {
  const wrap = document.createElement("article");
  wrap.className = "card";

  // --- head ---
  const head = document.createElement("div");
  head.className = "card-head";
  const hl = document.createElement("div");
  hl.className = "head-left";
  const hasError = (r.errors && r.errors.length) > 0;
  const headHTML = `
    <span class="scenario-id">${esc(r.scenario_id || r.id)}</span>
    <span class="room-type">${esc(r.room_type)}</span>
    <span class="source-name">${esc(r.source_name || "")}</span>
  `;
  hl.innerHTML = headHTML;
  const badge = document.createElement("span");
  if (hasError && !r.redesign_rel) {
    badge.className = "badge err";
    badge.textContent = "ERROR";
  } else if (r.redesign_rel && !hasError) {
    badge.className = "badge ok";
    badge.textContent = "COMPLETE";
  } else if (r.redesign_rel && hasError) {
    badge.className = "badge warn";
    badge.textContent = "PARTIAL";
  } else {
    badge.className = "badge warn";
    badge.textContent = "IN PROGRESS";
  }
  head.append(hl, badge);
  wrap.appendChild(head);

  // --- images ---
  const imgs = document.createElement("div");
  imgs.className = "images";
  const verdict = (r.empty_validation && r.empty_validation.verdict) || null;
  imgs.append(
    imgSlot("ORIGINAL", r.original_rel),
    imgSlot("EMPTY (V3)", r.empty_rel, verdict === "NOT_EMPTY" ? "not-empty" : (verdict === "EMPTY" ? "empty-verified" : null), verdict === "NOT_EMPTY" ? "contaminated" : null),
    imgSlot("V3 FINAL", r.redesign_rel, null, hasError && !r.redesign_rel ? "pipeline failed" : null),
  );
  wrap.appendChild(imgs);

  // --- meta ---
  const meta = document.createElement("div");
  meta.className = "meta";

  // blend
  const blendRow = document.createElement("div");
  blendRow.className = "blend-row";
  const sorted = Object.entries(r.style_blend || {}).sort((a,b) => b[1] - a[1]);
  for (const [k, w] of sorted) {
    const c = document.createElement("span");
    c.className = "blend-chip";
    c.innerHTML = `${esc(k)} <span class="pct">${fmt(w)}</span>`;
    blendRow.appendChild(c);
  }
  meta.appendChild(blendRow);

  // personalization
  if (r.personalization) {
    const p = document.createElement("div");
    p.className = "personalization";
    p.textContent = r.personalization;
    meta.appendChild(p);
  }

  // validation chip
  const vrow = document.createElement("div");
  vrow.className = "validation-row";
  if (!r.empty_rel && !hasError) {
    vrow.appendChild(chip("grey", "· empty-room pending"));
  } else if (hasError && !r.redesign_rel) {
    vrow.appendChild(chip("red", "✗ pipeline error"));
  } else if (verdict === "EMPTY") {
    vrow.appendChild(chip("green", "✓ empty verified"));
  } else if (verdict === "NOT_EMPTY") {
    vrow.appendChild(chip("yellow", "⚠ not empty — contaminated render"));
  } else if (verdict === "UNKNOWN") {
    vrow.appendChild(chip("grey", "? validation unclear"));
  }
  if (r.redesign_rel) vrow.appendChild(chip("green", "✓ redesign delivered"));
  if (r.timings_sec) {
    const total = Object.values(r.timings_sec).reduce((a,b) => a + (b || 0), 0);
    if (total > 0) vrow.appendChild(chip("grey", `${total.toFixed(0)}s total`));
  }
  meta.appendChild(vrow);

  // errors
  if (hasError) {
    const e = document.createElement("div");
    e.className = "errors";
    e.textContent = r.errors.join("\n");
    meta.appendChild(e);
  }

  wrap.appendChild(meta);
  return wrap;
}

function chip(cls, text) {
  const c = document.createElement("span");
  c.className = "chip " + cls;
  c.textContent = text;
  return c;
}

function imgSlot(label, rel, extraClass, placeholder) {
  const slot = document.createElement("div");
  slot.className = "image-slot";
  const w = document.createElement("div");
  w.className = "image-wrap" + (extraClass ? " " + extraClass : "");
  if (rel) {
    const img = document.createElement("img");
    img.src = "./" + rel;
    img.alt = label;
    img.loading = "lazy";
    img.onerror = () => { img.remove(); const ph = document.createElement("div"); ph.className = "placeholder err"; ph.textContent = "image missing"; w.appendChild(ph); };
    w.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "placeholder" + (placeholder ? " err" : "");
    ph.textContent = placeholder || "—";
    w.appendChild(ph);
  }
  const lab = document.createElement("div");
  lab.className = "image-label";
  const ln = document.createElement("span");
  ln.className = "lab-name";
  ln.textContent = label;
  lab.appendChild(ln);
  slot.append(w, lab);
  return slot;
}

load();
</script>
