# Supabase CLI config. Link to your project with: supabase link --project-ref YOUR_REF
# Get YOUR_REF from Supabase Dashboard → Settings → General → Reference ID

[project]
project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
